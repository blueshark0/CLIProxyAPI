services:
  mpapi:
    image: ${CLI_PROXY_IMAGE:-marcosman/mpapi:latest}
    pull_policy: always
    container_name: mpapi
    # env_file:
    #   - .env
    environment:
      DEPLOY: ${DEPLOY:-}
    # 8085 Gemini OAuth 回调
    # 1455 Codex (OpenAI) OAuth 回调
    # 54545 Claude (Anthropic) OAuth 回调
    # 51121 Antigravity OAuth 回调
    ports:
      - "9950:9950"
    #  - "1455:1455"
    #  - "54545:54545"
    #  - "51121:51121"
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-./config.yaml}:/CLIProxyAPI/config.yaml
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ${CLI_PROXY_PLUGIN_PATH:-./plugins}:/CLIProxyAPI/plugins
    restart: unless-stopped
